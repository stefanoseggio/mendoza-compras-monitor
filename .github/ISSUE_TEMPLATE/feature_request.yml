name: Feature Request
description: Propose a new input field, output field, or filter for the Actor
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a new filter or source-coverage change? Check the README's Known limitations
        section first — some gaps (e.g. no `CLOSED` event, no organism/process-type filter yet) are
        already documented as deliberate scope decisions or tracked requests.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. maxItems, onlyNew, eventTypes, resolveSourceUrl, dateRange)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input & Output Schema)
          required: true
